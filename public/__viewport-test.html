<!doctype html>
<!--
  Dev-only harness. Chrome on macOS will not make a window narrower than
  500px, and 375px is the primary target, so the app is framed at 375 here —
  an iframe establishes its own viewport, so media queries resolve correctly.

  Delete before shipping.
-->
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <title>375px harness</title>
    <style>
      body {
        margin: 0;
        background: #333;
        display: flex;
        gap: 12px;
        padding: 12px;
        font-family: system-ui;
      }
      iframe {
        width: 375px;
        height: 780px;
        border: 0;
        background: #fff;
        flex: none;
      }
    </style>
  </head>
  <body>
    <iframe id="f" src="/RSM-Draft/#/" title="375px preview"></iframe>
  </body>
</html>
