name: Deploy to Pages

# Builds and publishes whenever the CODE changes. Data is no longer part of
# that: the page fetches public/data/*.json from raw.githubusercontent.com
# at runtime (see src/data.tsx) instead of reading files baked into the
# build, so a data commit publishes itself with no deploy at all. That used
# to be the fragile part — a workflow's own push cannot trigger another
# workflow, so update-data dispatched this one by hand after every push,
# which fought Pages' own "cancel whatever is still in flight" behaviour on
# anything more frequent than one deploy at a time, needing a skip-if-in-
# flight workaround that only self-corrects if another change-worthy push
# follows. A quiet stretch with nothing to push — after a gameweek, or an
# international break — left the site stuck with no deploy to catch it up.
# Decoupling removes the coupling, not just the workaround: data commits are
# frequent and now irrelevant here; code changes are rare enough that the
# cancellation race stops mattering.
#
# public/data/** is explicitly excluded below rather than dropping public/**
# outright — the rest of public/ (images, fonts, the manifest) is still
# baked into the build and still needs a deploy when it changes, same as
# before; only the data commits specifically should stop triggering this.
#
# Note (11 Oct 2026): GitHub Pages deployments for this workflow stalled
# for several days — queued runs sat at "pending" with no job ever
# scheduled, both for workflow_dispatch and (per the push that added this
# comment) for push-triggered runs too. No incident was reported on
# githubstatus.com and nothing in this repo's config explained it. That
# particular failure mode cannot recur against data any more now that data
# never dispatches a deploy, but if the SITE'S CODE looks stale after a
# genuine code push, check the Actions tab before assuming this workflow
# ran cleanly.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - '!public/data/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # `npm run build` runs the image check first, so a missing Koch or MOTM
      # card fails the deploy rather than shipping a blank card.
      - run: npm run build

      - run: npm test

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
