name: Update data

# Cron is UTC, not UK time — an hour behind London for most of the season. The
# windows below are widened rather than shifted, so they stay correct on both
# sides of the clock change. GitHub's scheduler also runs late under load and
# skips very tight schedules; 15 minutes is about as fine as is reliable, and
# there is no point engineering around the lateness.
on:
  schedule:
    # Every 15 minutes, Sat–Sun 10:00–23:00 UTC — match days.
    - cron: '*/15 10-23 * * 6,0'
    # Every 15 minutes, Mon–Fri 16:00–23:00 UTC — evening kick-offs. A
    # Friday-night or midweek match is watched as closely as a Saturday one;
    # thirty minutes meant a game could be half an hour old before it showed.
    - cron: '*/15 16-23 * * 1-5'
    # Every 30 minutes, Thu–Fri 08:00–20:00 UTC — press-conference days.
    # Injury news breaks at Thursday and Friday pressers, and a flag sitting
    # three hours stale is worst exactly when people are checking it before a
    # deadline. Actions minutes are unlimited on a public repo, so this is free.
    - cron: '*/30 8-20 * * 4,5'
    # Every 15 minutes through the morning-after window, 08:45-10:30 UK on
    # both sides of the clock change: FPL locks scores and applies auto-subs
    # at 09:00 the day after a gameweek's last match, and the reveal fires
    # at 09:05. Which mornings matter cannot be read from cron, so these
    # runs fire daily and a gate below skips them unless the fixture data
    # says a gameweek confirms today.
    - cron: '45 7 * * *'
    - cron: '*/15 8-10 * * *'
    # Every 3 hours otherwise, so a quiet day still proves the job is alive.
    - cron: '0 */3 * * *'
  workflow_dispatch:

# Never let two runs commit over each other.
concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write
  # To dispatch the deploy once data is pushed.
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # The tight morning window runs every day; the fixture data says which
      # mornings matter. Anything else (a push, another cron) always runs.
      - name: Is this a morning worth polling?
        id: gate
        run: |
          if [ "${{ github.event.schedule }}" = "45 7 * * *" ] || [ "${{ github.event.schedule }}" = "*/15 8-10 * * *" ]; then
            node scripts/is-reveal-morning.mjs || { echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      # The only dependency the fetch needs is sharp, for measuring photo
      # framing. The install is allowed to fail: the script loads sharp lazily
      # and carries the framing over unchanged without it, so a broken
      # lockfile or registry can never stop the scores updating.
      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: npm ci --ignore-scripts=false || echo "Install failed; scores will still update, framing will not."
        continue-on-error: true

      - name: Fetch league data
        if: steps.gate.outputs.run == 'true'
        run: node scripts/fetch-data.mjs

      # The script rewrites a file only when its content changed, or every two
      # and a half hours as a heartbeat, so this is usually a no-op. Without
      # that, a 15-minute cron would produce hundreds of empty commits a week.
      - name: Commit if anything changed
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -z "$(git status --porcelain public/data)" ]; then
            echo "No change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "Update league data"
          # A scheduled run can race a push; rebase and retry rather than fail.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && echo "pushed=true" >> "$GITHUB_OUTPUT" && exit 0
            echo "Push attempt $attempt failed, retrying..."
            sleep 5
          done
          exit 1
        id: commit

      # A push made with the workflow's own token never triggers another
      # workflow, so the data would sit on main unpublished. Deploy is
      # dispatched by hand instead, and only when something was pushed.
      - name: Deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
