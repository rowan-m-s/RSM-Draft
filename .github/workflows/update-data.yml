name: Update data

# Cron is UTC, not UK time — an hour behind London for most of the season. The
# windows below are widened rather than shifted, so they stay correct on both
# sides of the clock change.
on:
  schedule:
    # Matchday windows: every 15 minutes, broad hours, Sat/Sun and weekday
    # evenings. Each trigger first checks the already-published fixture list
    # for whether a kickoff is actually near — instant, no network call — so
    # a day with nothing scheduled does nothing beyond that check: no fetch,
    # no commit, no visible activity. When a fixture genuinely is live
    # (started and not finished), the job stays open and polls every 60
    # seconds until nothing is live or a four-hour cap is hit, rather than
    # waiting for the next 15-minute tick — GitHub's scheduler is not
    # reliable tighter than about 5 minutes, so the minute-by-minute cadence
    # is done with an in-job sleep loop, not with cron itself.
    - cron: '*/15 10-23 * * 6,0'
    - cron: '*/15 16-23 * * 1-5'
    # Every 30 minutes, Thu–Fri 08:00–20:00 UTC — press-conference days.
    # Injury news breaks at Thursday and Friday pressers, and a flag sitting
    # three hours stale is worst exactly when people are checking it before a
    # deadline. Not matchday polling — left as is regardless of kickoffs.
    - cron: '*/30 8-20 * * 4,5'
    # Every 15 minutes through the morning-after window, 08:45-10:30 UK on
    # both sides of the clock change: FPL locks scores and applies auto-subs
    # at 09:00 the day after a gameweek's last match, and the reveal fires
    # at 09:05. Which mornings matter cannot be read from cron, so these
    # runs fire daily and a gate below skips them unless the fixture data
    # says a gameweek confirms today.
    # A punctual strike just after the 09:00 flip and the 09:05 reveal gate
    # (both UK offsets), then the window for the mornings GitHub runs late.
    - cron: '2 8 * * *'
    - cron: '2 9 * * *'
    - cron: '45 7 * * *'
    - cron: '*/15 8-10 * * *'
    # A slower tail into the afternoon for the mornings FPL seals late.
    - cron: '*/30 11-14 * * *'
    # Local finalisation's own reveal window (Addendum: own-gameweek-
    # finalisation §3): the reveal now fires at 00:00 London the day after a
    # gameweek's last match, or as soon as we locally finalise it ourselves
    # if that is later — it no longer waits on FPL's 09:00 flip. Every 15
    # minutes from 23:30 to 01:30 UK on both sides of the clock change, plus
    # a punctual 00:02 UK strike for the midnight slot itself. Which nights
    # matter cannot be read from cron either, so these fire daily too and the
    # same fixture-data gate below (is-reveal-morning.mjs, which already
    # reads the published revealFromUtc rather than assuming a time) skips
    # them otherwise — a gameweek can finish on any day of the week.
    - cron: '2 23 * * *'
    - cron: '2 0 * * *'
    - cron: '*/15 22,23 * * *'
    - cron: '*/15 0,1 * * *'
    # Every 3 hours otherwise, so a quiet day still proves the job is alive.
    # Unrelated to match polling: fetch-data.mjs forces its own rewrite every
    # 2.5 hours regardless of real change, purely so the site's own staleness
    # warning never trips on a quiet day — this cron just has to land inside
    # that window at least once.
    - cron: '0 */3 * * *'
  workflow_dispatch:

# Never let two runs commit over each other.
concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # Three kinds of scheduled trigger, three different questions. A
      # matchday cron asks the fixture list whether a kickoff is near, and
      # if so stays open afterwards to poll every minute (`watch`). The
      # morning-after crons ask whether a gameweek confirms today. Everything
      # else — the press-day window, the heartbeat, a push, a manual run —
      # always runs once, same as before.
      - name: Is this worth running?
        id: gate
        run: |
          case "${{ github.event.schedule }}" in
            "*/15 10-23 * * 6,0"|"*/15 16-23 * * 1-5")
              if node scripts/is-match-window.mjs; then
                echo "run=true" >> "$GITHUB_OUTPUT"
                echo "watch=true" >> "$GITHUB_OUTPUT"
              else
                echo "run=false" >> "$GITHUB_OUTPUT"
                echo "watch=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            "2 8 * * *"|"2 9 * * *"|"45 7 * * *"|"*/15 8-10 * * *"|"*/30 11-14 * * *"| \
            "2 23 * * *"|"2 0 * * *"|"*/15 22,23 * * *"|"*/15 0,1 * * *")
              echo "watch=false" >> "$GITHUB_OUTPUT"
              node scripts/is-reveal-morning.mjs \
                && echo "run=true" >> "$GITHUB_OUTPUT" \
                || echo "run=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "watch=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # The only dependency the fetch needs is sharp, for measuring photo
      # framing. The install is allowed to fail: the script loads sharp lazily
      # and carries the framing over unchanged without it, so a broken
      # lockfile or registry can never stop the scores updating.
      - name: Install
        if: steps.gate.outputs.run == 'true'
        run: npm ci --ignore-scripts=false || echo "Install failed; scores will still update, framing will not."
        continue-on-error: true

      - name: Fetch league data
        if: steps.gate.outputs.run == 'true'
        run: node scripts/fetch-data.mjs

      # The script rewrites a file only when its content changed, or every two
      # and a half hours as a heartbeat, so this is usually a no-op. Without
      # that, a 15-minute cron would produce hundreds of empty commits a week.
      #
      # Data lives at raw.githubusercontent.com now, not baked into the Pages
      # build (see src/data.tsx), so this commit is the whole publish — no
      # deploy dispatch follows it any more. That used to be the fragile part:
      # a workflow's own push cannot trigger another workflow, so deploy was
      # dispatched by hand, which fought Pages' own "cancel whatever is still
      # in flight" behaviour, which needed a skip-if-in-flight workaround that
      # only self-corrects if another change-worthy push follows. A commit
      # here is now the entire mechanism — nothing left to skip or get
      # cancelled.
      - name: Commit if anything changed
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -z "$(git status --porcelain public/data)" ]; then
            echo "No change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "Update league data"
          # A scheduled run can race a push; rebase and retry rather than
          # fail. A failed rebase leaves the tree mid-conflict, so each retry
          # aborts any stuck rebase first — otherwise a genuine conflict (two
          # runs touching the same file in the same minute, not just a clean
          # fast-forward) fails identically on every attempt with "unmerged
          # files" rather than actually retrying the pull.
          for attempt in 1 2 3; do
            git rebase --abort 2>/dev/null || true
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            echo "Push attempt $attempt failed, retrying..."
            sleep 5
          done
          exit 1

      # Runs on every trigger, gated or not — a quiet gate is exactly the
      # case a silently-dead schedule would also produce, so this cannot
      # only run alongside the steps above. A silent multi-day freeze has
      # happened twice now, found by eye both times; this makes it loud.
      - name: Guard — the data cannot go quiet mid-season
        run: node scripts/check-data-freshness.mjs

      # Only a matchday cron that found a fixture near kickoff reaches here.
      # The step above already did one fetch; this one checks whether that
      # fetch actually found something in progress, and if so keeps the job
      # open, polling every 60 seconds, until nothing is live or four hours
      # pass (GitHub's own 6-hour job limit is the backstop beyond that). A
      # manual dispatch or a code push never watches, even mid-match — this
      # is deliberately scoped to the scheduled matchday trigger alone, so a
      # manual run for testing never accidentally holds a runner open for
      # hours.
      - name: Watch while a match is live
        if: steps.gate.outputs.watch == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 240); do
            if ! node scripts/is-match-live.mjs; then
              echo "Nothing live; stopping the watch after $((i - 1)) extra minute(s)."
              break
            fi
            sleep 60
            node scripts/fetch-data.mjs || echo "Fetch failed this minute; trying again next minute."
            if [ -z "$(git status --porcelain public/data)" ]; then
              echo "No change this minute."
              continue
            fi
            git add public/data
            git commit -m "Update league data"
            pushed=false
            for attempt in 1 2 3; do
              git rebase --abort 2>/dev/null || true
              if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
                pushed=true
                break
              fi
              echo "Push attempt $attempt failed, retrying..."
              sleep 5
            done
            if [ "$pushed" != "true" ]; then
              echo "Could not push after 3 attempts; the commit stays local and will go out with next minute's push."
            fi
          done
